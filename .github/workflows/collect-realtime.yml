name: Collect Realtime Signals

# REALTIME GROUP — the only sources whose product value depends on a short
# lag, run together every ~15 minutes (never a provider burst; all three
# sources run sequentially within one job):
#   airport_congestion (A4-T1)     ~1 call/run (terminalId P01 only).
#                                   96 runs/day = 96 calls/day, ~10% of the
#                                   1,000/day dev quota (data.go.kr
#                                   15148225). Provider updates about once a
#                                   minute; 15 minutes stays well under.
#   airport_congestion_t2 (A4-T2)  ~1 call/run (one all-gates request, no
#                                   gateId filter). 96 runs/day = ~96
#                                   calls/day against the separate 15161098
#                                   dataset quota. Provider updates about
#                                   every 1-2 minutes; 15 minutes is a
#                                   deliberately lighter Phase-1 cadence, not
#                                   an attempt to match that refresh rate.
#   seoul_realtime (S1)      Integrated citydata population + Shinhan domestic-
#                             consumer commercial activity from the SAME call:
#                             1 call per target area (3 areas) = 3 calls/run,
#                             up to 6 with one retry per area. 96 runs/day =
#                             288 typical / 576 worst-case calls/day. Seoul
#                             Open Data does not publish one official
#                             cross-API quota number for this key; this cadence
#                             is sized against the conservative ~1,000/day-class
#                             assumption documented in docs/DATA_SOURCES.md
#                             (INTERNAL_ESTIMATE, not OFFICIAL_USAGE). Source
#                             data itself refreshes about every 5 minutes.
# SCHEDULER OWNERSHIP — this workflow deliberately has no `schedule:` block.
# The authoritative realtime scheduler is the Cloudflare Production Worker's
# trigger-only Cron (`"7,22,37,52 * * * *"` in wrangler.production.jsonc),
# which makes one authenticated workflow_dispatch call per firing and does no
# collection itself (see docs/REALTIME_SCHEDULER_AUDIT.md). The cadence is
# unchanged; the :07/:22/:37/:52 offsets stay off the exact quarter-hour
# marks per docs/ENGINEERING_DIRECTION.md, and KST is UTC+9 with no DST so a
# fixed-interval cadence is identical in both clocks. Restoring `schedule:`
# here while that Cron is live would create two authoritative schedulers and
# double the provider call budget above — it is only the documented rollback
# path, taken together with removing the Worker Cron.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector-realtime
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    # A shared gateway outage can consume ~178s for T1 and at most ~377s for
    # T2's three bounded pages. Twelve minutes leaves setup/D1/S1 margin.
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run collect:production
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: airport_congestion,airport_congestion_t2,seoul_realtime
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}

  # ONE FRESH RUNNER FOR THE CONGESTION PAIR, and only after a failure.
  #
  # `collect-attempt.yml` was written FOR this collector — its header names the
  # congestion collector as the case that "kept failing all four of its
  # in-process retries while, minutes later, a different runner reached seven
  # endpoints on that same host in under two seconds each." A1, A5 and weather
  # all adopted it. This workflow never did, and it is the one that suffers the
  # failure the mechanism exists to answer.
  #
  # Measured on Production over 14.7 h (2026-09-14 20:39 – 2026-09-15 11:23 KST,
  # 120 runs), which is what justifies adding a call path at all:
  #   · T1 21/60 failed, T2 21/60 failed — always in the same run as each other
  #   · every failure: failureClass=NETWORK causeCode=UND_ERR_CONNECT_TIMEOUT
  #     retryExhausted=true. The in-job ladder (30 s timeout, 3-4 attempts,
  #     ~67 s) rescued 0 of 21. It cannot: it keeps the refused egress address.
  #   · in 19 of those 21 runs `seoul_realtime` SUCCEEDED from the SAME runner
  #     at the SAME moment (118/120 overall), so the runner's network was fine
  #     and only this provider host was unreachable
  #   · the queue reading was therefore shown as "이전 대기 관측" for 240 of
  #     871 minutes — 27.6% of the window
  #
  # Only the congestion pair is retried. seoul_realtime succeeds 98% of the
  # time and re-requesting it would spend Seoul quota to fix an airport problem.
  #
  # PROVIDER BUDGET. T1 is ~1 call/run against dataset 15148225's 1,000/day and
  # T2 ~1 call/run against 15161098's own quota, so today's 96 runs/day cost
  # ~96 each (~10%). If EVERY run failed and every retry fired, that doubles to
  # ~192/day (~19%) — the true ceiling, not an estimate. In the dominant failure
  # mode the retry is cheaper still: a connect timeout means zero calls reached
  # the provider, so the retry is making the calls that never landed rather than
  # repeating ones that did. Writes stay changed-only, so a retry that finds the
  # same rows writes nothing.
  #
  # ONE retry, not A1's two: the next scheduled cycle is 15 minutes away here,
  # against A1's next window hours later, so a second fresh runner would buy
  # little that waiting does not. Timing: attempt 1 is bounded at 12 min and
  # this at 6, so a total gateway outage cannot push one round past ~18 min;
  # GitHub keeps at most one pending run per concurrency group, so a late round
  # cannot pile up.
  retry_congestion:
    needs: collect
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.collect.result == 'failure' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_congestion,airport_congestion_t2
      attempt: 2
      timeout_minutes: 6
    secrets: inherit
