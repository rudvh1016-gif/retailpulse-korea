name: Collect Realtime Signals

# REALTIME GROUP — the only sources whose product value depends on a short
# lag, run together every ~15 minutes (never a provider burst; all three
# sources run sequentially within one job):
#   airport_congestion (A4-T1)     ~1 call/run (terminalId P01 only).
#                                   96 runs/day = 96 calls/day, ~10% of the
#                                   1,000/day dev quota (data.go.kr
#                                   15148225). Provider updates about once a
#                                   minute; 15 minutes stays well under.
#   airport_congestion_t2 (A4-T2)  ~1 call/run (one all-gates request, no
#                                   gateId filter). 96 runs/day = ~96
#                                   calls/day against the separate 15161098
#                                   dataset quota. Provider updates about
#                                   every 1-2 minutes; 15 minutes is a
#                                   deliberately lighter Phase-1 cadence, not
#                                   an attempt to match that refresh rate.
#   seoul_realtime (S1)      Integrated citydata population + Shinhan domestic-
#                             consumer commercial activity from ONE call per
#                             target area. 4 areas (lib/areas.ts
#                             publicAreaIds) = 4 calls/run, up to 8 with one
#                             retry per failed area (fetchOfficialJson
#                             retries:1); Seoul has no fresh-runner retry.
#                             96 runs/day = 384 typical / 768 worst-case
#                             calls/day. No official daily call limit for this
#                             Seoul key is recorded in this repository: the
#                             Open Data Plaza says gallery-approved services
#                             can call without limit but gives no number for
#                             other keys. Any budget is an INTERNAL_ESTIMATE,
#                             not OFFICIAL_USAGE (see
#                             docs/COLLECTION_GAP_RETRY_2026-10-06.md and
#                             docs/ITAEWON_PREPARATION.md).
#                             Against a hypothetical 1,000/day, 768 would be
#                             76.8%, above the 70% NOTICE line. Source data
#                             itself refreshes about every 5 minutes.
# SCHEDULER OWNERSHIP — this workflow deliberately has no `schedule:` block.
# The authoritative realtime scheduler is the Cloudflare Production Worker's
# trigger-only Cron (`"7,22,37,52 * * * *"` in wrangler.production.jsonc),
# which makes one authenticated workflow_dispatch call per firing and does no
# collection itself (see docs/REALTIME_SCHEDULER_AUDIT.md). The cadence is
# unchanged; the :07/:22/:37/:52 offsets stay off the exact quarter-hour
# marks per docs/ENGINEERING_DIRECTION.md, and KST is UTC+9 with no DST so a
# fixed-interval cadence is identical in both clocks. Restoring `schedule:`
# here while that Cron is live would create two authoritative schedulers and
# double the provider call budget above — it is only the documented rollback
# path, taken together with removing the Worker Cron.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    # Hold the existing lock across BOTH primary and fresh retry, not the A1 child.
    concurrency:
      group: production-collector-realtime
      cancel-in-progress: false
    uses: ./.github/workflows/collect-realtime-cycle.yml
    secrets: inherit

  airport_midnight_recovery:
    needs: airport_today_coverage
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && github.ref == 'refs/heads/main' && needs.airport_today_coverage.outputs.a1_recovery_eligible == 'true' && needs.airport_today_coverage.outputs.a1_target_date != '' }}
    concurrency:
      group: production-collector
      cancel-in-progress: false
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_recent
      a1_midnight_recovery: true
      a1_midnight_caller: airport_midnight_recovery
      a1_expected_target_date: ${{ needs.airport_today_coverage.outputs.a1_target_date }}
      attempt: 1
      timeout_minutes: 20
      a1_max_requests: "125"
      a1_rescan_today: false
    secrets: inherit

  # Reuse the existing trigger; the durable one-hour lease limits provider reads.
  # Independent of airport/Seoul failures. No second timed owner or new secret.
  duty_free_exchange:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    concurrency:
      group: duty-free-exchange-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh official duty-free exchange snapshots
        run: node --import tsx scripts/collect-duty-free-exchange.ts
        env:
          ENABLE_PRODUCTION_COLLECTOR: 'true'
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}

  # Read-only witness, independent of the collection jobs. Reuses their trigger
  # and existing credentials; never calls a provider or changes last-good health.
  airport_today_coverage:
    outputs:
      a1_recovery_eligible: ${{ steps.coverage.outputs.a1_recovery_eligible }}
      a1_target_date: ${{ steps.coverage.outputs.a1_target_date }}
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check today's stored A1 date and collection stamp
        id: coverage
        run: npx tsx scripts/check-airport-today-coverage.ts
        env:
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          RPK_CENTRAL_RECOVERY_OWNER_APPROVED: ${{ vars.RPK_CENTRAL_RECOVERY_OWNER_APPROVED }}
          RPK_CENTRAL_RECOVERY_RUNTIME_ENABLED: ${{ vars.RPK_CENTRAL_RECOVERY_RUNTIME_ENABLED }}
