name: Collect Realtime Signals

# REALTIME GROUP — the only sources whose product value depends on a short
# lag, run together every ~15 minutes (never a provider burst; all three
# sources run sequentially within one job):
#   airport_congestion (A4-T1)     ~1 call/run (terminalId P01 only).
#                                   96 runs/day = 96 calls/day, ~10% of the
#                                   1,000/day dev quota (data.go.kr
#                                   15148225). Provider updates about once a
#                                   minute; 15 minutes stays well under.
#   airport_congestion_t2 (A4-T2)  ~1 call/run (one all-gates request, no
#                                   gateId filter). 96 runs/day = ~96
#                                   calls/day against the separate 15161098
#                                   dataset quota. Provider updates about
#                                   every 1-2 minutes; 15 minutes is a
#                                   deliberately lighter Phase-1 cadence, not
#                                   an attempt to match that refresh rate.
#   seoul_realtime (S1)      1 call per target area (3 areas) = 3 calls/run,
#                             up to 6 with one retry per area. 96 runs/day =
#                             288 typical / 576 worst-case calls/day. Seoul
#                             Open Data does not publish one official
#                             cross-API quota number for this key; this cadence
#                             is sized against the conservative ~1,000/day-class
#                             assumption documented in docs/DATA_SOURCES.md
#                             (INTERNAL_ESTIMATE, not OFFICIAL_USAGE). Source
#                             data itself refreshes about every 5 minutes.
# SCHEDULER OWNERSHIP — this workflow deliberately has no `schedule:` block.
# The authoritative realtime scheduler is the Cloudflare Production Worker's
# trigger-only Cron (`"7,22,37,52 * * * *"` in wrangler.production.jsonc),
# which makes one authenticated workflow_dispatch call per firing and does no
# collection itself (see docs/REALTIME_SCHEDULER_AUDIT.md). The cadence is
# unchanged; the :07/:22/:37/:52 offsets stay off the exact quarter-hour
# marks per docs/ENGINEERING_DIRECTION.md, and KST is UTC+9 with no DST so a
# fixed-interval cadence is identical in both clocks. Restoring `schedule:`
# here while that Cron is live would create two authoritative schedulers and
# double the provider call budget above — it is only the documented rollback
# path, taken together with removing the Worker Cron.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector-realtime
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run collect:production
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: airport_congestion,airport_congestion_t2,seoul_realtime
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
