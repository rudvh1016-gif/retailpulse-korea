name: Measure Production Read Budget

# Read-only D1 diagnostic. Runs no collectors and calls no provider, so it can
# never manufacture collection evidence; it replays the public read path and
# reports each statement's real rows_read, bounded by an explicit ceiling.
# Scope "storage" instead measures database size, per-table growth and a
# retention dry-run (scripts/measure-production-storage.ts); it deletes nothing.
# Explicit facility contract scopes make one approved provider read and no D1 access.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Read all existing diagnostic paths, only airport/Seoul calendar availability, or storage size and growth
        required: false
        type: choice
        options:
          - all
          - date_availability
          - storage
          - airport_sides
          - commercial_months
          - facility_parking
          - facility_lockers
        default: all
      ceiling:
        description: Maximum rows this diagnostic may read before it stops early
        required: false
        default: "100000"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Measure the live read path against Production D1
        if: inputs.scope != 'storage' && inputs.scope != 'airport_sides' && inputs.scope != 'commercial_months' && !startsWith(inputs.scope, 'facility_')
        run: npx tsx scripts/measure-production-read-budget.ts
        env:
          RPK_READ_BUDGET_CEILING: ${{ inputs.ceiling }}
          RPK_READ_BUDGET_SCOPE: ${{ inputs.scope }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
      - name: Measure Production D1 storage, growth and retention candidates
        if: inputs.scope == 'storage'
        run: npx tsx scripts/measure-production-storage.ts
        env:
          RPK_READ_BUDGET_CEILING: ${{ inputs.ceiling }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
      - name: Read stored airport departure-hall and gate shapes (read-only)
        if: inputs.scope == 'airport_sides'
        run: npx tsx scripts/measure-airport-sides.ts
        env:
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
      - name: Inspect eight stored commercial-month aggregates (read-only)
        if: inputs.scope == 'commercial_months'
        run: npx tsx scripts/inspect-commercial-month-coverage.ts
        env:
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
      - name: Check an explicitly approved facility service once (no D1)
        if: startsWith(inputs.scope, 'facility_')
        run: node scripts/check-approved-facility-contracts.mjs
        env:
          RPK_FACILITY_CONTRACT_SCOPE: ${{ inputs.scope == 'facility_parking' && 'parking' || 'lockers' }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
