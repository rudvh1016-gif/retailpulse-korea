name: Collect Airport Passenger Forecast (Recovery)

# A5 RECOVERY WINDOW — the temporal half of collector self-healing.
#
# The primary A5 collection runs once an hour at :42. A provider timeout there
# (UND_ERR_CONNECT_TIMEOUT on data.go.kr is intermittent) costs an ENTIRE
# hourly opportunity even when the provider recovers minutes later: that is
# how production served a forecast collected at 08:42 at 14:33. A4 realtime
# never had this problem because its own next 15-minute cycle repairs it.
#
# This is NOT a blind repeat of the primary. The run reads Production D1
# first (lib/collection-recovery.ts:planForecastRecovery):
#   · both days COMPLETE and collected within the hour -> ZERO provider
#     requests, status SKIPPED_ALREADY_HEALTHY
#   · only tomorrow missing -> ONE request (selectdate=1)
#   · both missing -> two requests, the same cost as one primary cycle
# Worst case therefore adds at most 24 x 2 = 48 requests/day on top of the
# primary's ~48, and the normal case adds zero.
#
# A failed recovery never deletes or zeroes stored rows; last-good A5 data is
# preserved and source_health becomes STALE rather than ERROR.
#
# SCHEDULER OWNERSHIP — Cloudflare Production Cron `53 * * * *` is the only
# automatic alarm. It performs one allowlisted workflow_dispatch and no
# provider or D1 work. Keeping a native GitHub schedule here would duplicate
# A5 provider calls.
#
# SELF-HEALING ACROSS RUNNERS — added after A5 lost an entire day.
#
# Every failure in that outage was NETWORK_UND_ERR_CONNECT_TIMEOUT with
# `requests 0`: the TCP connection to apis.data.go.kr never completed, so the
# provider never saw us. Minutes after the last of them, the credential-free
# smoke reached seven endpoints on that same host from a GitHub runner in
# under two seconds each. Retrying inside the job cannot help with that — it
# keeps the same runner and the same egress address, which is why the
# congestion collector exhausted all four of its in-process retries in the
# same window. A fresh JOB is a fresh runner, and that is the one thing an
# in-process retry can never be.
#
# So a failed attempt is followed by up to two more, each its own job.
#
# They cost nothing on a healthy run, and they cannot become a blind repeat:
# an attempt only starts after the previous one failed OUTRIGHT, which for
# these collectors means nothing at all was normalized and nothing was stored.
# A partial collection reports PARTIAL, not ERROR, and starts no retry — that
# case belongs to the recovery window, which reads Production D1 first and
# asks only for what is still missing.
#
# Every attempt names the same single source this workflow owns. A retry is
# not a second scheduler and must never smuggle in another source.

on:
  workflow_dispatch:

permissions:
  contents: read

# Shares the primary's group on purpose: a recovery can never overlap the
# :42 run, so the two can never call the provider at the same time.
concurrency:
  group: production-collector-forecast
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_passenger_forecast_recovery
      attempt: 1
    secrets: inherit

  retry_1:
    needs: collect
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.collect.result == 'failure' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_passenger_forecast_recovery
      attempt: 2
    secrets: inherit

  retry_2:
    needs: [collect, retry_1]
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.retry_1.result == 'failure' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_passenger_forecast_recovery
      attempt: 3
    secrets: inherit
