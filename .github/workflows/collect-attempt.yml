name: Collection Attempt

# ONE ATTEMPT, ON ITS OWN RUNNER.
#
# Callers use this to chain several attempts at the same collection, each as a
# separate job. That separation is the whole mechanism, and it is worth stating
# plainly because the obvious alternative does not work:
#
# The failure these collectors actually suffer is NETWORK_UND_ERR_CONNECT_TIMEOUT
# against apis.data.go.kr — the TCP connection never completes, so `requests 0`
# and the provider never even sees us. Retrying inside the job reuses the same
# runner and therefore the same egress address, which is why the congestion
# collector kept failing all four of its in-process retries while, minutes
# later, a different runner reached seven endpoints on that same host in under
# two seconds each. A fresh JOB is a fresh runner, and that is the one thing an
# in-process retry can never be.
#
# Cost when healthy is zero: a caller only starts the next attempt after the
# previous one failed outright. And a retry should always name the RECOVERY
# variant of a source where one exists — that path reads Production D1 first
# and requests only what is actually missing, so a retry can never become a
# blind repeat of a cycle that already stored its rows.

on:
  workflow_call:
    inputs:
      sources:
        description: RPK_PRODUCTION_SOURCES value for this attempt
        required: true
        type: string
      attempt:
        description: Which attempt this is, for the run log
        required: false
        default: 1
        type: number
      timeout_minutes:
        description: Job bound; weather asks for more because it walks three grids
        required: false
        default: 5
        type: number
      a1_max_requests:
        description: Per-run A1 provider-request ceiling; the run aborts rather than exceed it
        required: false
        default: ""
        type: string
      a1_rescan_today:
        description: Collect today's A1 scan even if one already succeeded today
        required: false
        default: false
        type: boolean
      a4_max_attempts_per_request:
        description: >-
          Per-request attempt ceiling for the A4 congestion pair on this
          attempt. Set by the realtime fresh-runner retry so one extra runner
          costs exactly one provider request per source, never the full
          ladder the normal 15-minute cycle is budgeted for. Unset elsewhere,
          so A1, A5 and weather keep their existing policies unchanged.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect ${{ inputs.sources }} (attempt ${{ inputs.attempt }})
        id: collect
        run: npm run collect:production
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: ${{ inputs.sources }}
          RPK_OPERATIONAL_ATTEMPT: ${{ inputs.attempt }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          RPK_A1_MAX_REQUESTS: ${{ inputs.a1_max_requests }}
          RPK_A1_RESCAN_TODAY: ${{ inputs.a1_rescan_today }}
          RPK_A4_MAX_ATTEMPTS_PER_REQUEST: ${{ inputs.a4_max_attempts_per_request }}
      # Informational only: never continue-on-error, never touches this job's
      # own conclusion or the caller workflow's `needs.<job>.result`. GitHub
      # computes a workflow run's overall red/green from ALL of its jobs, so
      # this attempt's own failure still makes the run read "failure" even
      # when a later attempt (a separate job, a fresh runner) succeeds -- that
      # is correct and must not be hidden. What this step adds is the one
      # thing the run badge cannot say: this attempt's OWN result, and where
      # the round's actual, evidence-checked result lives instead.
      - name: Record this attempt's own result (not the round's final verdict)
        if: always()
        run: |
          {
            echo "### Attempt ${{ inputs.attempt }} — ${{ inputs.sources }}"
            echo "- This job's own result: \`${{ steps.collect.outcome }}\`."
            echo "- This is one attempt, not the collection round. A prior attempt failing and this one succeeding (or vice versa) is normal for the fresh-runner retry design documented in this workflow's header."
            echo "- The round's actual outcome — whether data was re-validated, storage re-counted and the public surface re-checked — is decided by \`lib/recovery-orchestration.ts\` (\`verifyRecovery\`) against Production D1, never by this GitHub Actions run's overall conclusion badge."
            echo "- A red run badge here can still mean the round eventually succeeded on a later attempt; a green one never means every attempt in it also succeeded. Check the operational ledger (\`npm run health\`, \`operational_recovery_attempts\`) for the verified result."
          } >> "$GITHUB_STEP_SUMMARY"
