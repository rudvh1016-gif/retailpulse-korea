name: Collect Airport Departures (Early Window)

# A1 EARLY WINDOW — the day's first departures scan, and its fast retries.
#
# This used to be a 10:07 KST recovery that only ran four hours after the
# 06:07 primary. A blocked runner at 06:07 therefore cost the reader an entire
# morning: "오늘 출발편 수집이 완료되지 않았습니다" with the next attempt four
# hours out, on a screen whose whole purpose is today's gate ranking.
#
# It now runs FIRST, at 04:07 KST, and a failure is retried on a fresh runner
# within about a minute rather than four hours. Both halves matter:
#
#   · EARLY — today's departures are on screen before five in the morning
#     instead of after six.
#   · FRESH RUNNER — the failure this collector actually suffers is a blocked
#     egress address (measured 2026-09-06: two of eight runners could not open
#     a connection to apis.data.go.kr while six reached it in under four
#     seconds). Retrying inside the job keeps the address that was refused;
#     only a new job gets a new one.
#
# NOT a blind repeat. `airport_recent` reads collector_runs first
# (lib/airport-today.ts:hasCompleteA1RecentHistoryToday): a COMPLETE scan for
# today's KST date already recorded -> SKIPPED_ALREADY_COMPLETE_TODAY and ZERO
# provider requests. Only a day that still needs a scan pays for one.
#
# QUOTA — A1 documents 500 development calls/day, and the day's worst case is
# exactly that, never above:
#
#   this window   3 attempts x 125 = 375   (RPK_A1_MAX_REQUESTS; a run aborts,
#                                           rows untouched, rather than exceed)
#   06:07 group   1 attempt  x 125 = 125
#   worst case                       500
#   normal day    ~118 here, 0 or one refresh at 06:07
#
# A scan walks the D-3..today window at 100 rows a page, so 125 leaves margin
# over the ~118 pages the dataset actually needs. An attempt blocked at connect
# issues NO requests at all, which is why the retries are nearly free in
# practice as well as bounded on paper.
#
# The 06:07 group deliberately rescans rather than skipping: gate assignments
# firm up during the morning, and the busiest-gate ranking is what this screen
# is for. See lib/production-runner.ts.
#
# Cron is 04:07 KST (= 19:07 UTC the previous day). Off-minute per
# docs/ENGINEERING_DIRECTION.md. Scheduler ownership is unchanged: A1 lives in
# GitHub Actions, so no Worker Cron is added and the five Production crons
# stay exactly as they are.
on:
  schedule:
    - cron: "7 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shares the daily group's concurrency group on purpose: a recovery can never
# overlap the 06:07 run, so the two never call the provider at the same time.
concurrency:
  group: production-collector
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_recent,airport_enrichment
      attempt: 1
      timeout_minutes: 20
      a1_max_requests: "125"
    secrets: inherit

  retry_1:
    needs: collect
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.collect.result == 'failure' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_recent,airport_enrichment
      attempt: 2
      timeout_minutes: 20
      a1_max_requests: "125"
    secrets: inherit

  retry_2:
    needs: [collect, retry_1]
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.retry_1.result == 'failure' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_recent,airport_enrichment
      attempt: 3
      timeout_minutes: 20
      a1_max_requests: "125"
    secrets: inherit
