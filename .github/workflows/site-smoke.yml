name: Production Site Smoke

# Read-only, secret-free checks against the public production site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages and internal APIs
        run: |
          node <<'NODE'
          const origin = "https://koretaildata.com";
          let failed = false;
          const check = (name, ok, detail) => {
            console.log(JSON.stringify({ check: name, ok, detail }));
            if (!ok) failed = true;
          };

          for (const locale of ["ko", "en", "zh", "ja"]) {
            const response = await fetch(`${origin}/${locale}`, { redirect: "follow", signal: AbortSignal.timeout(15000) });
            const html = await response.text();
            check(`page /${locale}`, response.status === 200 && html.includes("KORETAIL"), `status ${response.status}`);
          }

          // Build freshness. "KORETAIL" alone cannot tell a current deployment
          // from a stale one, so a deploy that silently kept serving the old
          // bundle would still pass. These markers only exist in the build that
          // removed the fabricated demand index, so a stale edge fails loudly
          // instead of being explained away as caching.
          const korean = await (await fetch(`${origin}/ko`, { redirect: "follow", signal: AbortSignal.timeout(15000) })).text();
          check("serves the current build", korean.includes("지금 서울은"), "expected the current hero copy");
          check("no placeholder demand index", !/예시 수요지수|DEMO DEMAND INDEX/.test(korean), "sample index must not be served");

          // The business screen's operating checklist is server-rendered, so a
          // deploy that did not reach the edge shows up here as missing copy
          // rather than as a page that merely looks fine.
          const business = await fetch(`${origin}/ko/business`, { redirect: "follow", signal: AbortSignal.timeout(15000) });
          const businessHtml = await business.text();
          check("business checklist is served", business.status === 200 && businessHtml.includes("먼저 볼 신호") && businessHtml.includes("혼잡 시간대"), `status ${business.status}`);

          const about = await fetch(`${origin}/ko/about`, { redirect: "follow", signal: AbortSignal.timeout(15000) });
          const aboutHtml = await about.text();
          check("about page is live", about.status === 200 && aboutHtml.includes("KORETAIL은 무엇인가요"), `status ${about.status}`);

          // "HTTP 200 with no data" must never read as healthy. On 2026-09-01 the
          // D1 free daily row-read allowance ran out: every page still answered
          // 200, /api/health said database "unavailable" with an empty source
          // list, every area came back null, and this smoke passed. These checks
          // are the semantic ones that would have caught it.
          const health = await fetch(`${origin}/api/health`, { signal: AbortSignal.timeout(15000) });
          const healthBody = await health.json().catch(() => null);
          check("api /api/health", health.status === 200 && healthBody?.app === "ok", `status ${health.status}; db ${healthBody?.database}`);
          check("health reports a usable database", healthBody?.database === "ok", `database is ${healthBody?.database ?? "missing"}`);
          check("health lists source status", Array.isArray(healthBody?.sources) && healthBody.sources.length > 0, `${healthBody?.sources?.length ?? 0} sources`);
          console.log(JSON.stringify({ healthSources: healthBody?.sources ?? [] }));

          // A unique cache key prevents a pre-import null response from making
          // the post-import Store Dynamics acceptance check read stale edge data.
          const cacheProbeKey = `site-smoke-${Date.now()}`;
          const summary = await fetch(`${origin}/api/live/summary?cacheProbe=${cacheProbeKey}`, { signal: AbortSignal.timeout(15000) });
          const summaryBody = await summary.json().catch(() => null);
          check("api /api/live/summary", summary.status === 200 && Boolean(summaryBody?.mode), `status ${summary.status}; mode ${summaryBody?.mode}`);
          for (const source of summaryBody?.sources ?? []) console.log(JSON.stringify({ source }));
          check("summary is in live mode", summaryBody?.mode === "live-summary", `mode ${summaryBody?.mode ?? "missing"}`);
          check("summary carries the core areas", Boolean(summaryBody?.areas) && ["myeongdong", "hongdae", "seongsu"].every((area) => area in (summaryBody.areas ?? {})), "areas object incomplete");
          // A legitimately quiet day has no events and may have no sales, so
          // neither of those alone fails. Every area losing BOTH its realtime
          // reading and its weather rows at once is not a quiet day - that is
          // the database being unreadable.
          const coreAreas = ["myeongdong", "hongdae", "seongsu"];
          const areasWithCoreData = coreAreas.filter((area) => {
            const block = summaryBody?.areas?.[area] ?? {};
            return Boolean(block.realtime) || (block.weather?.length ?? 0) > 0;
          });
          check("core live data is present", areasWithCoreData.length > 0, `${areasWithCoreData.length}/${coreAreas.length} areas have realtime or weather`);

          const expectedStoreDynamics = {
            myeongdong: { code: "3001492", name: "명동 남대문 북창동 다동 무교동 관광특구", type: "U", typeName: "관광특구" },
            hongdae: { code: "3120103", name: "홍대입구역(홍대)", type: "D", typeName: "발달상권" },
            seongsu: { code: "3110131", name: "성수동카페거리", type: "A", typeName: "골목상권" },
          };
          const storeDynamics = coreAreas.map((area) => ({
            area,
            row: summaryBody?.areas?.[area]?.storeDynamics ?? null,
          }));
          // Phase B v1 publishes counts only (see docs/DATA_SOURCES.md §"Rate
          // semantics"): the public API projection no longer carries
          // openingRateTenthsPercent/closureRateTenthsPercent, so this check
          // no longer asserts on them.
          const storeDynamicsValid = storeDynamics.every(({ area, row }) => {
            const expected = expectedStoreDynamics[area];
            const counts = [row?.totalStoreCount, row?.ordinaryStoreCount, row?.franchiseStoreCount, row?.openingCount, row?.closureCount];
            return row
              && /^\d{4}[1-4]$/.test(String(row.quarterCode ?? ""))
              && counts.every((value) => Number.isSafeInteger(value) && value >= 0)
              && row.totalStoreCount > 0
              && row.totalStoreCount === row.ordinaryStoreCount + row.franchiseStoreCount
              && row.datasetId === "OA-15577"
              && row.mappingVersion === "oa-15577-standard-area-2026-09-03-v1"
              && row.tradeAreaCode === expected.code
              && row.tradeAreaName === expected.name
              && row.tradeAreaTypeCode === expected.type
              && row.tradeAreaTypeName === expected.typeName
              && Number.isFinite(Date.parse(row.retrievedAt));
          });
          const storeDynamicsQuarters = new Set(storeDynamics.map(({ row }) => row?.quarterCode).filter(Boolean));
          check(
            "Store Dynamics covers all three exact areas",
            storeDynamicsValid && storeDynamicsQuarters.size === 1,
            `${storeDynamics.filter(({ row }) => Boolean(row)).length}/${coreAreas.length} areas`,
          );
          console.log(JSON.stringify({ storeDynamics }));
          const storeDynamicsHealth = (healthBody?.sources ?? []).find(
            (source) => source.sourceId === "SEOUL_STORE_DYNAMICS",
          );
          check(
            "Store Dynamics Source Health is historical or preserved stale",
            storeDynamicsHealth?.status === "OFFICIAL_HISTORICAL"
              || (storeDynamicsHealth?.status === "STALE" && storeDynamicsValid && storeDynamicsQuarters.size === 1),
            `status ${storeDynamicsHealth?.status ?? "missing"}`,
          );

          if (summaryBody?.mode === "live-summary") {
            const areas = summaryBody.areas ?? {};
            for (const area of ["myeongdong", "hongdae", "seongsu"]) {
              const block = areas[area] ?? {};
              console.log(JSON.stringify({
                area,
                realtime: block.realtime ? { congestionLabel: block.realtime.congestionLabel, observedAt: block.realtime.observedAt, freshness: block.realtime.freshness } : null,
                weatherRows: block.weather?.length ?? 0,
                eventRows: block.events?.length ?? 0,
                sales: block.sales ? { quarterCode: block.sales.quarterCode, industryCount: block.sales.industryCount } : null,
              }));
            }
          }

          // The date picker's day lists come from three probe statements the
          // route runs through the Worker's D1 binding. safeAll swallows a
          // failing statement into an empty list, so a broken probe would show
          // up as a picker offering nothing rather than as an error - the same
          // silent-empty failure mode the row-read incident hid behind. The
          // database demonstrably holds many days of both flights and Seoul
          // observations, so empty lists here mean the statement failed.
          const availability = summaryBody?.dateAvailability ?? {};
          console.log(JSON.stringify({ dateAvailability: {
            airportFlights: availability.airportFlights?.length ?? null,
            airportPassengerForecast: availability.airportPassengerForecast?.length ?? null,
            seoulObserved: availability.seoulObserved?.length ?? null,
          } }));
          check("date picker offers airport flight days", (availability.airportFlights?.length ?? 0) > 0, `${availability.airportFlights?.length ?? 0} days`);
          check("date picker offers Seoul observation days", (availability.seoulObserved?.length ?? 0) > 0, `${availability.seoulObserved?.length ?? 0} days`);
          const a5Health = (healthBody?.sources ?? []).find(
            (source) => source.sourceId === "INCHEON_PASSENGER_FORECAST",
          );
          if (a5Health?.status === "LIVE") {
            check(
              "date picker offers A5 forecast days when A5 is live",
              (availability.airportPassengerForecast?.length ?? 0) > 0,
              `${availability.airportPassengerForecast?.length ?? 0} days; source ${a5Health.status}`,
            );
          }

          // Does the edge actually serve a shared cached copy? The success path
          // asks for it (`public, max-age=60, stale-while-revalidate=300`), but a
          // Worker response is not cached just because it says so, and on D1 Free
          // every uncached request is billed rows. Two identical back-to-back
          // requests answer it: CF-Cache-Status HIT with a non-zero Age means the
          // second reader cost no database reads at all. This is reported, never
          // failed - caching is an optimisation, and the read path has to be
          // affordable uncached anyway.
          const cacheProbe = async () => {
            const response = await fetch(`${origin}/api/live/summary?cacheProbe=${cacheProbeKey}`, { signal: AbortSignal.timeout(15000) });
            const body = await response.json().catch(() => null);
            return {
              status: response.status,
              cfCacheStatus: response.headers.get("cf-cache-status"),
              age: response.headers.get("age"),
              cacheControl: response.headers.get("cache-control"),
              // An identical generatedAt across two reads is the body itself
              // proving it was reused, independently of any header.
              generatedAt: body?.generatedAt ?? null,
              mode: body?.mode ?? null,
            };
          };
          const firstRead = {
            status: summary.status,
            cfCacheStatus: summary.headers.get("cf-cache-status"),
            age: summary.headers.get("age"),
            cacheControl: summary.headers.get("cache-control"),
            generatedAt: summaryBody?.generatedAt ?? null,
            mode: summaryBody?.mode ?? null,
          };
          await new Promise((resolve) => setTimeout(resolve, 1200));
          const secondRead = await cacheProbe();
          const thirdRead = await cacheProbe();
          const hitRead = [secondRead, thirdRead].find((read) => read.cfCacheStatus === "HIT");
          const bodyReused = Boolean(firstRead.generatedAt)
            && [secondRead, thirdRead].some((read) => read.generatedAt === firstRead.generatedAt);
          console.log(JSON.stringify({
            edgeCache: {
              firstRead, secondRead, thirdRead,
              bodyReused,
            },
          }));
          check(
            "summary Edge Cache moves from cold to HIT",
            ["MISS", "EXPIRED"].includes(firstRead.cfCacheStatus)
              && Boolean(hitRead)
              && bodyReused
              && [firstRead, secondRead, thirdRead].every((read) => read.status === 200 && read.mode === "live-summary")
              && String(firstRead.cacheControl ?? "").includes("public"),
            `${firstRead.cfCacheStatus ?? "missing"} -> ${hitRead?.cfCacheStatus ?? "no-hit"}; age ${hitRead?.age ?? "missing"}; reused ${bodyReused}`,
          );

          // A ?date= day the picker offers must still render live, not fall back
          // to an empty shell. Yesterday in KST is always one of those days.
          const kstYesterday = new Date(Date.now() + 9 * 3600 * 1000 - 86400 * 1000).toISOString().slice(0, 10);
          const dated = await fetch(`${origin}/api/live/summary?date=${kstYesterday}`, { signal: AbortSignal.timeout(15000) });
          const datedBody = await dated.json().catch(() => null);
          check("dated summary answers live", dated.status === 200 && datedBody?.mode === "live-summary", `date ${kstYesterday}; status ${dated.status}; mode ${datedBody?.mode}`);

          // The summary is now served through a cached entrypoint, so two
          // different ?date= values sharing one cached body would present one
          // day's numbers under another day's label - silently wrong data for
          // every reader. Cloudflare's default cache key includes the query
          // string, which is exactly the kind of assumption that has to be
          // checked against the real edge rather than trusted.
          const datedRead = async (day) => {
            const response = await fetch(`${origin}/api/live/summary?date=${day}`, { signal: AbortSignal.timeout(15000) });
            const body = await response.json().catch(() => null);
            return {
              day,
              status: response.status,
              serviceDateKst: body?.serviceDateKst ?? null,
              generatedAt: body?.generatedAt ?? null,
              cfCacheStatus: response.headers.get("cf-cache-status"),
              age: response.headers.get("age"),
            };
          };
          const kstDayBefore = new Date(Date.now() + 9 * 3600 * 1000 - 2 * 86400 * 1000).toISOString().slice(0, 10);
          const dayOne = await datedRead(kstYesterday);
          const dayTwo = await datedRead(kstDayBefore);
          const dayOneRepeat = await datedRead(kstYesterday);
          console.log(JSON.stringify({ dateIsolation: { dayOne, dayTwo, dayOneRepeat } }));
          check(
            "each dated summary answers for the date it was asked for",
            dayOne.serviceDateKst === kstYesterday && dayTwo.serviceDateKst === kstDayBefore,
            `${kstYesterday} -> ${dayOne.serviceDateKst}; ${kstDayBefore} -> ${dayTwo.serviceDateKst}`,
          );
          check(
            "a repeated date is still that date, cached or not",
            dayOneRepeat.serviceDateKst === kstYesterday,
            `${kstYesterday} -> ${dayOneRepeat.serviceDateKst}; cf ${dayOneRepeat.cfCacheStatus}; age ${dayOneRepeat.age}`,
          );

          const redirect = await fetch(`http://koretaildata.com/ko`, { redirect: "manual", signal: AbortSignal.timeout(15000) });
          check("http->https redirect", [301, 308].includes(redirect.status), `status ${redirect.status}`);

          if (failed) process.exitCode = 1;
          NODE
