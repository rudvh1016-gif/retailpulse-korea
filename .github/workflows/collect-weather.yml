name: Collect Weather Forecasts

# WEATHER GROUP — W1 (KMA short-term forecast) aligned to the official
# 단기예보 issuance cycle (02/05/08/11/14/17/20/23 KST, +~10min provider
# publish buffer per docs/DATA_SOURCES.md), not a continuous poll. 3 unique
# KMA grid cells cover the 3 product areas = 3 calls/run, up to 9 with two
# spaced transient retries per grid. 8 runs/day = 24 typical / 72 worst-case
# calls/day, well
# under the 10,000/day dev quota (data.go.kr 15084084).
#
# SCHEDULER OWNERSHIP — Cloudflare Production Cron
# `10 2,5,8,11,14,17,20,23 * * *` is the only automatic alarm. It performs
# one allowlisted workflow_dispatch and no provider/D1 work. Keeping a native
# GitHub schedule here would duplicate W1 provider calls.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector-weather
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    # Three grids × (3 × 10s requests + 5s/30s waits + bounded jitter) ≤198s
    # provider-path maximum, plus setup/D1 margin. The job remains bounded.
    timeout-minutes: 7
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run collect:production
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: weather
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
