name: Collect Weather Forecasts

# WEATHER GROUP — W1 (KMA short-term forecast) aligned to the official
# 단기예보 issuance cycle (02/05/08/11/14/17/20/23 KST, +~10min provider
# publish buffer per docs/DATA_SOURCES.md), not a continuous poll. 3 unique
# KMA grid cells cover the 3 product areas = 3 calls/run, up to 6 with one
# retry per grid. 8 runs/day = 24 typical / 48 worst-case calls/day, well
# under the 10,000/day dev quota (data.go.kr 15084084).
#
# KST is UTC+9 and the issuance slots are spaced exactly 3 hours apart (a
# multiple of 9), so the UTC cron hours are numerically the same set
# {2,5,8,11,14,17,20,23} — verified by direct KST->UTC conversion, not
# assumed. :10 gives the +10min publish buffer and is already off the
# top of the hour.
on:
  schedule:
    - cron: "10 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector-weather
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run collect:production
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: weather
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
