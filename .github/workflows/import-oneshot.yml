name: One-shot Data Import

# Temporary bounded main-push trigger for the single A1/A2/A3 parser-fix
# revalidation. There is still NO schedule trigger; recurring collection stays
# behind ENABLE_PRODUCTION_COLLECTOR and separate owner approval.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sources:
        description: Comma list (seoul_realtime, seoul_foreign, seoul_sales, weather, events, airport_congestion, airport_flights, airport_flight_enrichment, airport_scheduled)
        required: true
        default: seoul_realtime,seoul_sales
        type: string
      confirm:
        description: Type IMPORT to confirm this bounded one-shot write
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oneshot-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/import-oneshot.ts
        env:
          RPK_ONESHOT_CONFIRM: ${{ inputs.confirm || 'IMPORT' }}
          RPK_ONESHOT_SOURCES: ${{ inputs.sources || 'airport_flights,airport_flight_enrichment,airport_scheduled' }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
