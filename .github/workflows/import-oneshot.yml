name: One-shot Data Import

# Manual only. This intentionally has NO schedule trigger: the recurring
# production collector stays behind ENABLE_PRODUCTION_COLLECTOR and separate
# owner approval in collect-production.yml.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: Comma list for IMPORT, or probe_seoul_citydata_contract for the read-only contract probe
        required: true
        default: seoul_realtime,seoul_sales
        type: string
      confirm:
        description: Type IMPORT for a bounded write, or PROBE for the read-only Seoul contract check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oneshot-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Probe integrated Seoul city-data contract (read only)
        if: inputs.sources == 'probe_seoul_citydata_contract' && inputs.confirm == 'PROBE'
        run: npx tsx scripts/probe-seoul-citydata-contract.ts
        env:
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
      - name: Run bounded one-shot import
        if: inputs.sources != 'probe_seoul_citydata_contract'
        run: npx tsx scripts/import-oneshot.ts
        env:
          RPK_ONESHOT_CONFIRM: ${{ inputs.confirm }}
          RPK_ONESHOT_SOURCES: ${{ inputs.sources }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
      - name: Reject an invalid Seoul contract-probe confirmation
        if: inputs.sources == 'probe_seoul_citydata_contract' && inputs.confirm != 'PROBE'
        run: exit 1
