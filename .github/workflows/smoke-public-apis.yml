name: Smoke Public APIs

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Providers to contact
        required: true
        default: all
        type: choice
        options: [all, seoul]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Request each source once without persistence
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          SMOKE_SCOPE: ${{ inputs.scope }}
        run: node scripts/smoke-public-apis.mjs
