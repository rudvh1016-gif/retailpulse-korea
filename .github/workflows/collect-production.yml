name: Collect Production Data

# DAILY GROUP — once/day, sequential/staggered (never a provider burst):
#   airport_recent (A1)      D-3..today bounded scan; same-day guard makes
#                             any extra invocation the same KST day free.
#   airport_enrichment (A2)  runs after A1 so same-day A1 rows exist to match.
#   airport_facilities       terminal facility directory; slow-changing, so the
#                             collector skips without a provider request unless
#                             its last success is older than its refresh window.
#   airport_scheduled (A3)   future schedule refresh; independent model.
#   events (T1)               daily festival/event refresh.
#   seoul_foreign (S2)       delayed official short-stay foreign presence;
#   subway_ridership (S5)    official daily station boarding/alighting totals;
#                             daily catches newly published data quickly.
# Cron is 06:07 KST (= 21:07 UTC previous day; KST is UTC+9 with no DST).
# :07 is an off-minute offset per docs/ENGINEERING_DIRECTION.md to avoid
# GitHub's top-of-hour scheduling congestion.
on:
  schedule:
    - cron: "7 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    # A1's bounded scan can read up to 150 sequential pages; generous margin
    # keeps a slow provider day from false-failing the whole daily group.
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run collect:production
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: airport_recent,airport_enrichment,airport_facilities,airport_scheduled,events,seoul_foreign,foreign_purpose_mobility,subway_ridership
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          RPK_RETAIN_FLIGHT_CHANGE_HISTORY: ${{ vars.RPK_RETAIN_FLIGHT_CHANGE_HISTORY }}
          # A1 now runs first at 04:07 KST (collect-airport-recovery.yml). This
          # run is the day's refresh, not its first sight of the day: gate
          # assignments firm up through the morning and the busiest-gate
          # ranking is what the departures screen is for, so it rescans instead
          # of skipping. The ceiling keeps the day's worst case at exactly A1's
          # documented 500 calls -- 3 x 125 early + 1 x 125 here.
          RPK_A1_MAX_REQUESTS: "125"
          RPK_A1_RESCAN_TODAY: "true"
