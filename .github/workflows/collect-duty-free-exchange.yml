name: Collect Duty-free Exchange

# Startup after the existing automatic production deploy; daily refresh uses
# collect-production.yml. No new recurring schedule, visitor fetch or retries.
on:
  workflow_run:
    workflows: [Deploy Cloudflare]
    types: [completed]
    branches: [main]

permissions:
  contents: read
concurrency:
  group: duty-free-exchange-production
  cancel-in-progress: false

jobs:
  collect:
    # Startup only follows the existing automatic production deploy, never staging/PR/fork.
    if: >-
      vars.ENABLE_PRODUCTION_COLLECTOR == 'true' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require current main revision
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read official public HTML and store independent verified rates
        run: node --import tsx scripts/collect-duty-free-exchange.ts
        env:
          ENABLE_PRODUCTION_COLLECTOR: 'true'
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
