name: Collect Airport Passenger Forecast

# FORECAST GROUP — A5 (airport_passenger_forecast, dataset 15095066, V5.0
# passgrAnncmt) is official T1/T2 arrival/departure passenger FORECAST data,
# refreshed by the provider about every 5 minutes. KORETAIL does not need to
# poll that often: Phase-1 cadence is once/hour. Each normal cycle queries
# BOTH selectdate=0 (today) and selectdate=1 (tomorrow) = ~2 provider
# requests, with bounded pagination only if a day's totalCount ever exceeds
# one page. 24 runs/day x ~2 requests = ~48 requests/day, far under any
# plausible data.go.kr quota for this dataset.
#
# SCHEDULER OWNERSHIP — this workflow deliberately has no `schedule:` block.
# The authoritative forecast scheduler is the Cloudflare Production Worker's
# trigger-only Cron (`"42 * * * *"` in wrangler.production.jsonc). It makes
# one authenticated workflow_dispatch call and performs no provider work or
# D1 access. Restoring a GitHub schedule while that Cron is live would create
# duplicate A5 provider calls.
#
# SELF-HEALING ACROSS RUNNERS — added after A5 lost an entire day.
#
# Every failure in that outage was NETWORK_UND_ERR_CONNECT_TIMEOUT with
# `requests 0`: the TCP connection to apis.data.go.kr never completed, so the
# provider never saw us. Minutes after the last of them, the credential-free
# smoke reached seven endpoints on that same host from a GitHub runner in
# under two seconds each. Retrying inside the job cannot help with that — it
# keeps the same runner and the same egress address, which is why the
# congestion collector exhausted all four of its in-process retries in the
# same window. A fresh JOB is a fresh runner, and that is the one thing an
# in-process retry can never be.
#
# So a failed attempt is followed by up to two more, each its own job.
#
# They cost nothing on a healthy run, and they cannot become a blind repeat:
# an attempt only starts after the previous one failed OUTRIGHT, which for
# these collectors means nothing at all was normalized and nothing was stored.
# A partial collection reports PARTIAL, not ERROR, and starts no retry — that
# case belongs to the recovery window, which reads Production D1 first and
# asks only for what is still missing.
#
# Every attempt names the same single source this workflow owns. A retry is
# not a second scheduler and must never smuggle in another source.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector-forecast
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_passenger_forecast
      attempt: 1
    secrets: inherit

  retry_1:
    needs: collect
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.collect.result == 'failure' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_passenger_forecast
      attempt: 2
    secrets: inherit

  retry_2:
    needs: [collect, retry_1]
    if: ${{ always() && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.retry_1.result == 'failure' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: airport_passenger_forecast
      attempt: 3
    secrets: inherit
