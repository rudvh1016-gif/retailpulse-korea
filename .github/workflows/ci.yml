name: CI

on:
  push:
    branches: [main, production-v1, fix/seoul-glance-transfer-truth]
  pull_request:
  # PR #149 was opened and pushed to twice without GitHub ever creating a
  # `pull_request` run, leaving the branch with no way to be verified except
  # by merging it blind. A manual trigger is the supported way to re-run a
  # check that never fired; closing and reopening a PR to kick CI is not.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Run 38041338089 reached the 45-minute limit during the 1,163-case
    # integration suite. Preserve every check and allow setup and retries to finish.
    timeout-minutes: 75
    env:
      # Match the Playwright server so built metadata/icons remain same-origin.
      # This verification build is never used for a production deployment.
      NEXT_PUBLIC_SITE_ORIGIN: http://127.0.0.1:4173
      PLAYWRIGHT_PRODUCTION_SERVER: "true"
      RPK_DEPLOYMENT_STAGE: staging
      NEXT_PUBLIC_ENABLE_BETA_SIGNUP: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run secret:scan
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install xlrd==2.0.2
      - run: python tests/transfer-parser.py
      - run: npm run test:unit
      # Config-derived operational audit. With no Production credentials it
      # reports the scheduler graph, the doc/config drift and the runtime-LLM
      # verdict, and exits non-zero only on ERROR (a duplicate live scheduler, a
      # dead Worker route, a runtime model call). UNKNOWN is the expected answer
      # from a checkout and must not fail the build.
      - run: npm run health
        env:
          # The Actions Variable that gates every collector schedule, handed to
          # the harness so it can tell "disabled" from "cannot tell".
          #
          # `classifyRuntimeEnablement` has accepted `knownVariables` since the
          # scheduler graph was built, and scripts/health.ts has read
          # RPK_KNOWN_ENABLE_PRODUCTION_COLLECTOR since 2026-09-14 — but nothing
          # ever supplied it, so all ten variable-gated schedules reported
          # RUNTIME_ENABLE_STATE_UNKNOWN and the harness's own P1 list was ten
          # copies of that one unwired line. A collector group silently switched
          # off would have looked exactly like the normal state.
          #
          # Only this one name is forwarded; repository Variables are not
          # harvested wholesale, and no secret is involved. Where the Variable is
          # not visible the expression yields "", which health treats as UNKNOWN
          # rather than as disabled — the offline answer stays honest.
          RPK_KNOWN_ENABLE_PRODUCTION_COLLECTOR: ${{ vars.ENABLE_PRODUCTION_COLLECTOR }}
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
      # Fails on a high/critical vulnerability, but not on the registry being
      # unreachable — those are different facts and `npm audit` reports both
      # with the same non-zero exit. See the script for what it does instead.
      - run: bash scripts/audit-production-deps.sh
      - run: npm run e2e:install
      - name: Critical UI checks before the full suite
        run: >-
          npx playwright test e2e/airport-glance-hydration.spec.ts e2e/glance-passenger-forecast.spec.ts e2e/seoul-display-truth.spec.ts
          --grep 'hydration keeps the server-rendered glance /ko 390|official daily passenger row scopes and date 390|partial full-day coverage|mismatched dates and failed data|valid-zero 390'
          --output critical-ui-results
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            test-results/
            critical-ui-results/
          retention-days: 7
          if-no-files-found: ignore


  airport-focus-preview:
    if: github.head_ref == 'preview/airport-focus-review' || github.ref_name == 'preview/airport-focus-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_ORIGIN: http://127.0.0.1:4173
      PLAYWRIGHT_PRODUCTION_SERVER: "true"
      RPK_DEPLOYMENT_STAGE: staging
      NEXT_PUBLIC_ENABLE_BETA_SIGNUP: "false"
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run e2e:install
      - run: npx playwright test e2e/airport-focus-preview.spec.ts e2e/airport-focus-production.spec.ts e2e/airport-staff-briefing.spec.ts e2e/airport-reference-comparisons.spec.ts e2e/arrival-allowance-refresh.spec.ts e2e/month-comparison-compact.spec.ts e2e/glance-artwork-srcset.spec.ts --output airport-focus-results --workers=2
      - name: Verify final integration regressions
        run: >-
          npx playwright test e2e/airport-date-navigation.spec.ts e2e/airport-default-start.spec.ts
          e2e/airport-v14-scenes.spec.ts e2e/airport-v5-scopes.spec.ts e2e/approved-airport-models.spec.ts
          e2e/approved-choice-motion.spec.ts e2e/mobile-briefing-repair.spec.ts e2e/mobile-image-ladders.spec.ts
          e2e/premium-demand.spec.ts e2e/pure-white.spec.ts
          --grep 'KST midnight refresh|default start|v14 overview|distinct compact|all-building country|approved live models|departure order is opt-in|owner UI lock|T2 scene picks|mobile overview picks|monthly records and compact|pure white · en · 390px'
          --output airport-final-regression-results --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airport-focus-approval-images
          path: |
            airport-focus-results/
            airport-final-regression-results/
          retention-days: 7
          if-no-files-found: warn

  airport-focus-performance:
    if: github.head_ref == 'preview/airport-focus-review' || github.ref_name == 'preview/airport-focus-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_ENABLE_BETA_SIGNUP: "false"
      PLAYWRIGHT_PRODUCTION_SERVER: "true"
      RPK_DEPLOYMENT_STAGE: staging
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run e2e:install
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .benchmark-main
      - name: Compare unchanged dependency inputs
        run: |
          cmp package-lock.json .benchmark-main/package-lock.json
          ln -s ../node_modules .benchmark-main/node_modules
          mkdir -p airport-performance
          git rev-parse HEAD > airport-performance/after-revision.txt
          git -C .benchmark-main rev-parse HEAD > airport-performance/before-revision.txt
      - name: Build and measure main under the same browser conditions
        run: |
          (cd .benchmark-main && NEXT_PUBLIC_SITE_ORIGIN=http://127.0.0.1:4174 npm run build)
          setsid bash -c 'cd .benchmark-main && exec npm run start -- --hostname 127.0.0.1 --port 4174' > "$RUNNER_TEMP/before-server.log" 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4174/ko -o /dev/null && break || sleep 1; done
          node scripts/measure-airport-focus-lab.mjs http://127.0.0.1:4174/ko "$PWD/airport-performance/before.json" BEFORE
      - name: Build and measure candidate without deployment
        run: |
          NEXT_PUBLIC_SITE_ORIGIN=http://127.0.0.1:4173 npm run build
          setsid bash -c 'exec npm run start -- --hostname 127.0.0.1 --port 4173' > "$RUNNER_TEMP/after-server.log" 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ko -o /dev/null && break || sleep 1; done
          node scripts/measure-airport-focus-lab.mjs http://127.0.0.1:4173/ko "$PWD/airport-performance/after.json" AFTER
      - name: Enforce matched frontend regression budgets
        run: node scripts/compare-airport-focus-lab.mjs airport-performance/before.json airport-performance/after.json airport-performance/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airport-focus-performance
          path: airport-performance/
          retention-days: 7
          if-no-files-found: warn
