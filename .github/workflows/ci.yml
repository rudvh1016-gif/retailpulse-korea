name: CI

on:
  push:
    branches: [main, production-v1, fix/seoul-glance-transfer-truth]
  pull_request:
  # PR #149 was opened and pushed to twice without GitHub ever creating a
  # `pull_request` run, leaving the branch with no way to be verified except
  # by merging it blind. A manual trigger is the supported way to re-run a
  # check that never fired; closing and reopening a PR to kick CI is not.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_ORIGIN: https://rpk-ci.invalid
      RPK_DEPLOYMENT_STAGE: staging
      NEXT_PUBLIC_ENABLE_BETA_SIGNUP: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run secret:scan
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install xlrd==2.0.2
      - run: python tests/transfer-parser.py
      - run: npm run test:unit
      # Config-derived operational audit. With no Production credentials it
      # reports the scheduler graph, the doc/config drift and the runtime-LLM
      # verdict, and exits non-zero only on ERROR (a duplicate live scheduler, a
      # dead Worker route, a runtime model call). UNKNOWN is the expected answer
      # from a checkout and must not fail the build.
      - run: npm run health
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
      # Fails on a high/critical vulnerability, but not on the registry being
      # unreachable — those are different facts and `npm audit` reports both
      # with the same non-zero exit. See the script for what it does instead.
      - run: bash scripts/audit-production-deps.sh
      - run: npm run e2e:install
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
