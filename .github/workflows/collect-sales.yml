name: Collect Estimated Sales

# SLOW GROUP — S3 estimated sales and OA-15577 Store Dynamics are quarterly
# historical sources, so both are polled weekly to detect a newly published
# quarter rather than swept on every collection cycle. Estimated sales makes at
# most 30 bounded requests (five probes plus 25 pages) and Store Dynamics at
# most 17 (five probes plus three pages for each of four areas).
# Cron is Sunday 07:07 KST (= Saturday 22:07 UTC previous day; KST is
# UTC+9 with no DST), deliberately offset from the DAILY group's 06:07 KST
# window so this key's weekly sweep never overlaps that run.
#
# FRESH-RUNNER RETRY (2026-10-12). On 2026-10-11 both sources died on their
# first request with a ~10 s TCP connect timeout from one runner while another
# runner reached openapi.seoul.go.kr seconds later, and the next chance was a
# week away. A source that fails with exactly that signature (one request,
# NETWORK connect timeout — lib/congestion-retry.ts decideWeeklySeoulRetry)
# gets up to two more attempts, each a new job on a fresh runner via
# collect-attempt.yml, 60 s and then 300 s apart, and only that source is
# collected again. Auth, 403, quota, Seoul result codes and every other failure
# are never retried. A failed attempt writes nothing, so last-good rows and
# source_health.last_retrieved_at stay as they were. Retries run only for the
# main branch, inside this run's concurrency group; the run badge stays red
# when a retry succeeds (see collect-attempt.yml).
on:
  schedule:
    - cron: "7 22 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector-sales
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      retry_weekly_seoul: ${{ steps.retry_decision.outputs.retry_weekly_seoul }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect seoul_sales,store_dynamics
        shell: bash
        run: |
          set -o pipefail
          npm run collect:production 2>&1 | tee "$RUNNER_TEMP/collector.log"
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: seoul_sales,store_dynamics
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
      - name: Classify this attempt before spending a fresh runner
        id: retry_decision
        if: ${{ always() }}
        run: npx tsx scripts/decide-congestion-retry.ts "$RUNNER_TEMP/collector.log" --weekly-seoul

  retry_1:
    needs: collect
    if: ${{ always() && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.collect.result == 'failure' && needs.collect.outputs.retry_weekly_seoul != '' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: ${{ needs.collect.outputs.retry_weekly_seoul }}
      attempt: 2
      timeout_minutes: 30
    secrets: inherit

  retry_2:
    needs: [collect, retry_1]
    if: ${{ always() && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_COLLECTOR == 'true' && needs.retry_1.result == 'failure' && needs.retry_1.outputs.retry_weekly_seoul != '' }}
    uses: ./.github/workflows/collect-attempt.yml
    with:
      sources: ${{ needs.retry_1.outputs.retry_weekly_seoul }}
      attempt: 3
      timeout_minutes: 30
    secrets: inherit
