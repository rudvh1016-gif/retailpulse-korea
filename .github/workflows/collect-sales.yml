name: Collect Estimated Sales

# SLOW GROUP — S3 estimated sales and OA-15577 Store Dynamics are quarterly
# historical sources, so both are polled weekly to detect a newly published
# quarter rather than swept on every collection cycle. Store Dynamics adds at
# most 14 bounded requests (five probes plus three pages for each exact area).
# Cron is Sunday 07:07 KST (= Saturday 22:07 UTC previous day; KST is
# UTC+9 with no DST), deliberately offset from the DAILY group's 06:07 KST
# window so this key's weekly sweep never overlaps that run.
on:
  schedule:
    - cron: "7 22 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-collector-sales
  cancel-in-progress: false

jobs:
  collect:
    if: vars.ENABLE_PRODUCTION_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run collect:production
        env:
          ENABLE_PRODUCTION_COLLECTOR: "true"
          RPK_PRODUCTION_SOURCES: seoul_sales,store_dynamics
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
