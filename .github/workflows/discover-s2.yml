name: Discover S2 Foreign Presence Source

# Read-only, manual-only discovery of the current official Seoul 250m-grid
# short-stay foreign living-population product. Touches Seoul hosts only —
# no data.go.kr request is made — and persists nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Probe the official Seoul catalog and OpenAPI without persistence
        env:
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
        run: node scripts/discover-s2.mjs
