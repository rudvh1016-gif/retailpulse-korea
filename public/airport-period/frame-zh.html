<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>机场期间对比</title><link rel="stylesheet" href="./style.css?v=f51e0744d1cb"></head><body><div id="load-state" role="status" class="page">正在加载机场记录…</div><main class="page" hidden><section id="insight" aria-labelledby="section-title">
<nav class="standalone-tabs" hidden role="tablist" aria-label="机场分析"><button role="tab" data-view="rhythm">何时最集中？</button><button role="tab" data-view="weekday">周末航班更多吗？</button><button role="tab" data-view="terminal">哪个航站楼有变化？</button><button role="tab" data-view="holiday">连休期间增加了吗？</button><button role="tab" data-view="country">各国航班</button></nav>
<div class="section-heading"><h2 id="section-title"></h2><span class="kind-label">计划出发航班 · KST</span></div><p id="section-intro" class="section-intro" hidden>轻松查看上午及下午的变化</p>
<div class="toolbar"><div id="scope-controls" class="scope" role="group" aria-label="分析范围"><button data-scope="ALL">全部</button><button data-scope="T1">T1·卫星厅</button><button data-scope="T2">T2</button></div><span id="fixed-scope" hidden></span><label id="country-control" hidden>目的地 <select id="country-select" aria-label="目的地国家"></select></label></div>
<div class="presets" role="group" aria-label="快速选择期间"><button id="today-preset" hidden>当日对比</button><button data-weeks="1">最近1周</button><button data-weeks="2">最近2周</button><button data-weeks="4">最近4周</button><button data-weeks="6">最近6周</button><button id="month-preset">上月 ↔ 本月</button></div>
<label id="today-compare-control" hidden>与今日对比的日期 <input type="date" id="today-compare-date" aria-label="与今日对比的日期"></label>
<div id="terminal-events" class="holiday-suggestions" hidden><span>航空公司转场</span><button type="button" data-terminal-event="asiana">韩亚航空 · 2026/01/14</button><button type="button" data-terminal-event="airseoul">首尔航空 · 2025/09/09</button><button type="button" data-terminal-event="airbusan">釜山航空 · 2025/07/29</button><small>T1 → T2 · 转场前后4周 · 可修改日期</small><p id="terminal-event-status" role="status"></p></div>
<div id="holiday-suggestions" class="holiday-suggestions" hidden></div>
<form id="range-form" class="range-form"><fieldset><legend><i class="swatch before"></i>基准期</legend><div><label>开始<input type="date" id="a-start" aria-label="基准期开始日期" required></label><span> ~ </span><label>结束<input type="date" id="a-end" aria-label="基准期结束日期" required></label></div></fieldset><span class="versus">VS</span><fieldset><legend><i class="swatch"></i>对比期</legend><div><label>开始<input type="date" id="b-start" aria-label="对比期开始日期" required></label><span> ~ </span><label>结束<input type="date" id="b-end" aria-label="对比期结束日期" required></label></div></fieldset><button type="submit" class="apply">应用期间</button><p id="range-error" role="alert"></p></form>
<p id="comparison-caption" class="comparison-caption"></p><p id="context-note" class="context-note"></p>
<section id="panel" aria-labelledby="finding-title"><div class="finding"><div><h3 id="finding-title"></h3><p id="finding-subtitle"></p></div><div id="finding-metrics" class="finding-metrics"></div></div>
<div class="figure-heading"><h4 id="chart-title"></h4><div class="figure-options"><label id="peak-control">高峰时段 <select id="peak-window" aria-label="高峰时段长度"><option value="2">2小时</option><option value="3" selected>3小时</option><option value="4">4小时</option></select></label><div id="measure-control" class="measure" role="group" aria-label="图表单位"><button data-measure="count">日均班次</button><button data-measure="share">占比</button></div></div></div>
<div id="legend" class="legend"></div><div id="holiday-calendar-context" class="holiday-calendar-context" aria-label="各期假日与采集日期" hidden></div><div id="chart" class="comparison-chart"></div><div id="selection" class="selection"></div><div id="bands" class="band-grid"></div>
<div class="work-context"><p id="takeaway"></p><button id="country-jump">查看同期各国航班 →</button></div><p id="boundary" class="boundary"></p>
<section id="country-context" hidden><div class="figure-heading"><h4>同期各国航班</h4><span>全机场 · 班/日</span></div><div id="country-rank"></div></section>
<details id="hourly-detail" class="evidence" hidden><summary>查看24小时数值 <span>＋</span></summary><div id="hourly-table"></div></details>
<details id="evidence" class="evidence"><summary>纳入日期及计算依据 <span>＋</span></summary><div id="method"></div><div id="data-table"></div></details></section>
<div class="source-line"><span id="coverage"></span><span>按已存计划出发航班</span></div></section></main><p id="announcement" class="sr-only" aria-live="polite"></p>
<script type="module" src="./runtime.js?v=f51e0744d1cb"></script></body></html>
